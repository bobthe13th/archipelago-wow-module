# azerothcore-wotlk/modules/archipelago_wow/content/traps.yaml
family: traps

# Task 17 (design spec §8's trap menu). Items only, no locations -- a trap's
# effect fires on receipt, not on a location check, matching gates.yaml's
# shape. Each item's `delivery.effect` is a slug identifying which case
# ApplyTrapEffect (APTraps.cpp) handles; `delivery.lethal` puts it in the
# separate "lethal" weight bucket the design spec says defaults off
# (§18#5). `count` here is a ceiling, exactly like gates.yaml's per-item
# counts and filler.yaml's row count -- Archipelago/worlds/wow/items.py's
# create_trap_item_pool decides how many of each are actually pooled for a
# given generation's trap_percentage_of_filler/distribution_mode/
# lethal_traps options, and locations.py's create_filler_locations sizes
# its sink-location slice to match that count exactly (same item=location
# parity discipline as Task 11 -- see that task's outcome note in
# docs/m4-plan.md for why "worst-case slack" doesn't work).
#
# Only 5 of these 15 non-lethal + 2 lethal effects have a real,
# API-verified ApplyTrapEffect case as of Task 17's initial landing
# (durability_damage, buff_strip, polymorph, teleport_to_graveyard,
# screen_drunk) -- the rest are cataloged here and dispatch to a logged,
# safe no-op until their own research/implementation pass. See Task 17's
# outcome note in docs/m4-plan.md for exactly which and why.
items:
  - name: "Trap: Random Debuff"
    item_id: 850000
    count: 5
    delivery: {kind: trap, effect: random_debuff, lethal: false}
