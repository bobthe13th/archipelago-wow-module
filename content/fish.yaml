# One "Fish: <name>" item per location, mirroring quests.yaml's exact
# 1:1-within-family shape (not gates.yaml's zero-locations shape) -- reuses
# the `mail` delivery kind quests.yaml already established (APDelivery.cpp's
# existing DeliverItem), mailing the player a real copy of that species'
# actual WoW item (wow_item_entry) when the AP item is received. As in every
# other AP world, this item is NOT necessarily received at the location
# named after the same fish -- the fill algorithm places items independently
# of which location's check revealed them; "Fish Catch: X" is only the
# in-game TRIGGER that sends location X's check, "Fish: X" is a separate
# collectible the fill algorithm can place anywhere in the pool. Fishing
# Quest's completion rule (goals.py) requires ALL 46 "Fish: <name>" items
# collected, regardless of which locations revealed them.
