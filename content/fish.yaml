# azerothcore-wotlk/modules/archipelago_wow/content/fish.yaml
family: fish

# Task 26 (design spec Sec5.4, Tier 2: Fishing Quest mode). Unlike Key Hunt's
# rares.yaml (Task 25), this family's locations/items are NOT density-sampled
# -- spec Sec5.4: "the set is bounded and discrete... which makes it a
# tractable completion goal" -- sampling it would break the completion
# condition (you can't be asked to catch a fish that was never in the pool).
# Both this family's locations AND items are unconditionally created
# whenever game_mode is fishing_quest, same "gated on game_mode itself, not
# an independent toggle" shape rares.yaml established, just without the
# density step.
#
# The 46 rows below are the FULL real "normally obtainable via open-water/
# pool fishing" fish set for this checkout, not a representative subset --
# per spec Sec5.4's own definition. Researched directly against this
# checkout's own data, not assumed:
#   1. Parsed every row of data/sql/base/db_world/fishing_loot_template.sql
#      (251 rows across every zone's fishing pool), resolving each
#      Reference-table indirection through reference_loot_template.sql (the
#      Item column of a reference row IS a real item entry; the Comment
#      column even carries the real display name directly) to a flat set of
#      249 distinct real item entries reachable via fishing anywhere on this
#      realm.
#   2. Cross-referenced every one of those 249 entries against
#      item_template.sql, keeping only class=7 (ITEM_CLASS_TRADE_GOODS)
#      subclass=8 rows -- empirically confirmed as the real classification
#      for genuine fish species (e.g. entry 6289 "Raw Longjaw Mud Snapper",
#      6291 "Raw Brilliant Smallfish"), which excludes non-fish "junk"
#      catches also reachable via the same loot tables (potions, Driftwood,
#      Empty Clam, and the class=15 quest-only weight-tracked variants like
#      "10 Pound Mud Snapper" used for a specific quest's turn-in counting,
#      not a real collectible species). This yielded exactly 46 real fish
#      species, cleanly within the "20-40+" the plan itself expected.
#
# `region: northrend` (13 of the 46 rows) marks entries introduced in this
# checkout's WotLK item-id range (41800-41814) -- item ids in WoW are
# allocated in expansion-contiguous blocks, and this block is the one
# genuinely new fishing-catch range added for Northrend content, distinct
# from the pre-existing vanilla/TBC-era entries (4603-35285) below it.
# FLAG, HONEST ABOUT CONFIDENCE: this is a verified item-id-range heuristic,
# not an exhaustively zone-verified per-fish mapping (tracing each fish to
# its exact spawning area's AreaTable.dbc entry would need DBC-parsing
# tooling this checkout's SQL dumps don't expose) -- five additional WotLK-
# era entries (43571-43652: Sewer Carp, Magic Eater, Fountain Goldfish,
# Shimmering Minnow, Slippery Eel, from patch 3.1's "Whimsical" fishing
# tournament content) are deliberately left untagged rather than guessed,
# since their real catch locations are not confidently Northrend-exclusive
# from the data available. rules.py's Northrend Passage gate is only ever
# too permissive here (an ungated fish that's actually Northrend-only would
# be a minor logic-softness, not a hard-unreachable-goal bug), never too
# restrictive -- the safer direction to err given the uncertainty.
