# One item definition, ceiling count 40 matching the location list above --
# NOT always pooled at 40; items.py's create_key_hunt_item_pool pools exactly
# as many copies as create_rares_locations sampled (same density.sample_category
# call, cached on the World instance so both sides agree on the count without
# re-sampling). Uses the realm_state delivery kind (like Progressive Level
# Cap/Instance Unlock), not gates.yaml's flag kind -- a key is a countable
# progression item, tracked by ArchipelagoRealmState::GetKeyCount()/GrantKey(),
# not a boolean.
items:
  # item_id 730040 (one past this family's own 730000-730039 location_id
  # range, verified against every content/*.yaml family's real id ranges
  # before assigning) -- previously 830029, which silently collided with
  # gates.yaml's "Bank Access" (both names then resolved to the same real
  # AP item id in the merged item_name_to_id map). Found during M4.9.6's
  # final whole-branch review; fixed as a standalone follow-up.
  - name: "Key Hunt: Key"
    item_id: 730040
    count: 40
    delivery: {kind: realm_state, effect: grant_key, step: 1}
