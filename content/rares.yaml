# azerothcore-wotlk/modules/archipelago_wow/content/rares.yaml
family: rares

# Task 25 (design spec Sec5.4/Sec5.2.1, Tier 2: Key Hunt mode). Only relevant
# when game_mode is key_hunt -- both this family's locations AND its "Key
# Hunt: Key" item are pooled conditionally in the apworld (locations.py's
# create_rares_locations / items.py's create_key_hunt_item_pool both check
# world.options.game_mode before doing anything), unlike every other content
# family in this module, which is either always-pooled (core_loop, quests) or
# gated by an independent toggle option that can coexist with any game_mode
# (proficiency_gating, traps_enabled). This is the first content family whose
# existence is gated on which GameMode is active, not a separate toggle.
#
# The 40 rows below are a curated subset of this checkout's real rare-mob
# roster, not the full set -- researched directly against
# data/sql/base/db_world/creature_template.sql (rank IN (2, 4), i.e.
# CREATURE_ELITE_RAREELITE/CREATURE_ELITE_RARE, the same two ranks the game
# client uses to show the silver-dashed "Rare"/"Rare Elite" nameplate),
# cross-referenced against data/sql/base/db_world/creature.sql to confirm
# each entry has at least one real overworld spawn (map 0/1/530/571 --
# Eastern Kingdoms/Kalimdor/Outland/Northrend), and stratified-sampled by
# minlevel to spread evenly across the full level range and all four
# continents. This produced 40 of 360 real, spawned rank-2/4 rares.
#
# IMPORTANT, documented explicitly rather than silently: "notable"/"famous"
# was NOT used as a selection criterion, because a spot-check during
# curation showed this checkout's data does not reliably match live-retail
# fame -- e.g. Time-Lost Proto-Drake (entry 32153) is rank=1 (plain elite,
# not rank 2/4) in this dataset, and several other well-known Northrend
# rares are rank=2 rather than rank=4. Trusting memory of what's "famous"
# against data that doesn't match memory would have been unverified
# guessing, the exact mistake this project's research discipline exists to
# avoid. The 40 below are therefore an objectively-reproducible sample
# (rank + real spawn existence + even level/continent spread), not a
# hand-picked "greatest hits" list -- a fine substitute for Key Hunt's
# purposes (spec's own framing: "a few dozen rows is enough to prove the
# mode, not an exhaustive server-wide sweep"), but a future task is free to
# replace individual rows with more iconic picks if that's ever desired.
#
# Density-sampled, not always-pooled: locations.py's create_rares_locations
# calls density.sample_category against this full 40-row list (weight 100,
# so only the global check_density and the shared MaxOptionalLocations
# ceiling constrain how many of these 40 are actually used in one
# generation) -- per the plan's own Interfaces note for this task ("Key
# Hunt's rares are sampled through sample_category like any other optional
# category, not hand-picked"). This is the FIRST real caller of Task 2's
# density.py module anywhere in this codebase.
#
# M4.11.1 Task 5: `tags: {zone: [...]}` added to every row below -- a real
# per-row top-level WoW zone, NOT derived from creature.sql's own zoneId/
# areaId columns (both are 0 for all 40 of these creature entries in this
# checkout's live DB, confirmed directly: `SELECT id, map, position_x,
# position_y, zoneId, areaId FROM creature WHERE id IN (...)` returns
# zoneId=0/areaId=0 for every single row). `map` IS populated correctly
# (matches each row's existing `# level N, <continent>` comment) but is
# only continent-granularity, already covered by the existing
# MAP_ID_TO_EXPANSION mechanism -- not the zone-level granularity this tag
# needs.
#
# Real mechanism used instead: each entry's real (map, position_x,
# position_y) spawn point(s) (queried live, every real row from `creature`
# for that entry, not just one) resolved against this checkout's real
# WorldMapArea.dbc via two new tools/db_extract.py functions this task adds
# (following that file's own existing WDBC-parsing precedent):
# db_extract.parse_world_map_areas() parses WorldMapArea.dbc
# (var/extractors/dbc/WorldMapArea.dbc, WorldMapAreaEntryfmt = "xinxffffixx"
# per src/server/shared/DataStores/DBCfmt.h:131, confirmed against that same
# file's WorldMapAreaEntry struct comment, DBCStructure.h:2147-2160:
# field1=map_id, field2=area_id, fields4-7=y1/y2/x1/x2 bounding box,
# field8=virtual_map_id) into a (map_id, area_id, bounding box) list; then
# db_extract.resolve_zone_id_from_position(map, x, y, ...) picks, among
# every row whose map_id matches the creature's own real map and whose
# bounding box contains that point, the SMALLEST-area candidate (more
# specific sub-region beats an enclosing/overlapping neighbor), and feeds
# that winning area_id into Task 2's own db_extract.parse_area_zone_ids
# (AreaTable.dbc's `zone` parent-chain walk, identical mechanism Task 2
# already ships for Quest Rewards' zone tagging) to get the real top-level
# zone_id. Verified against this checkout's real 108-row WorldMapArea.dbc
# and 2307-row AreaTable.dbc. rares.yaml has no extract_rares.py of its own
# (this family is hand-curated, per this file's own header above) --
# these values were computed with a one-off script calling the two new
# db_extract.py functions directly and hand-transcribed into the `tags:`
# blocks below, exactly like this file's creature_entry/level/continent
# values were originally hand-curated from creature_template.sql/
# creature.sql. Re-running db_extract.parse_world_map_areas() +
# resolve_zone_id_from_position() + parse_area_zone_ids() against each of
# the 40 creature_entry values' real (map, position_x, position_y) rows
# reproduces every zone tag below exactly (spot-checked live during this
# task).
#
# Confidence, spot-checked against all 40 rows (multi-spawn majority vote
# where a creature has more than one real spawn row, to guard against a
# single spawn landing right on a WorldMapArea bounding-box edge):
#   - 37 of 40 resolve unanimously across every one of that creature's real
#     spawn points, and match this row's own pre-existing `# level N,
#     <continent>` comment at the map/continent level (real cross-check,
#     not assumed). Several also match this project's own general WoW
#     knowledge of that named rare's real zone (e.g. Morgaine the Sly ->
#     Elwynn Forest, Commander Felstrom -> Duskwood, Kazon/Chatter ->
#     Redridge Mountains, Grizlak -> Loch Modan) -- HIGH confidence.
#   - Drogoth the Roamer (entry 14231, 2 real spawns) split 1 Mulgore/1
#     Dustwallow Marsh: its first spawn sits only ~78 world-units inside
#     Mulgore's own bounding-box edge (a near-miss, not a solid interior
#     point), while its second spawn falls OUTSIDE Mulgore's box entirely
#     and comfortably inside Dustwallow Marsh's. Real irregular zone
#     borders recede from their rectangular WorldMapArea bounding box, so a
#     near-edge bbox hit is the least reliable kind of match; resolved to
#     Dustwallow Marsh. MEDIUM-HIGH confidence.
#   - Goretooth (entry 17144, 5 real spawns) splits 3 Nagrand/1 Zangarmarsh/
#     1 Terokkar Forest -- majority Nagrand, matching this project's
#     independent recollection of Goretooth as a real Nagrand clefthoof
#     rare. HIGH confidence.
#   - Ambassador Jerrikar (entry 18695, 5 real spawns) splits 3 Shadowmoon
#     Valley/2 Terokkar Forest -- both zones share a real border and this
#     creature patrols across it; majority-vote used, MEDIUM confidence
#     (the minority zone is also plausible for this specific named rare).
#   - Dr. Whitherlimb (entry 22062, 4 real spawns, real map=530) resolves
#     unanimously to Ghostlands, not literal "Outland" terrain -- a genuine,
#     confirmed WotLK client quirk, NOT a bug in this mechanism: Ghostlands/
#     Eversong Woods/Silvermoon City/Isle of Quel'Danas are real WorldMapArea
#     rows under map_id=530 (this checkout's real DBC data, directly
#     verified), because Blizzard's own client stores Quel'Thalas terrain on
#     the same physical map file as Outland (both added in the same Burning
#     Crusade content patch) -- consistent with this row's own pre-existing
#     "level 18, Outland" comment at the MAP_ID_TO_EXPANSION
#     continent/expansion level (map 530 -> "tbc"), while this new zone tag
#     correctly gives the more precise real zone underneath that same map.
#     HIGH confidence.
#
# A `creature_addon`/pathing-based alternative (resolving zone from a
# creature's full waypoint path rather than its raw spawn rows) was
# considered and rejected as unnecessary extra complexity: the multi-spawn
# majority vote above already resolves every real ambiguity this checkout's
# 40 curated rows produce.
