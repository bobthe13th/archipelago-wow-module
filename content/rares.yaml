# azerothcore-wotlk/modules/archipelago_wow/content/rares.yaml
family: rares

# Task 25 (design spec Sec5.4/Sec5.2.1, Tier 2: Key Hunt mode). Only relevant
# when game_mode is key_hunt -- both this family's locations AND its "Key
# Hunt: Key" item are pooled conditionally in the apworld (locations.py's
# create_rares_locations / items.py's create_key_hunt_item_pool both check
# world.options.game_mode before doing anything), unlike every other content
# family in this module, which is either always-pooled (core_loop, quests) or
# gated by an independent toggle option that can coexist with any game_mode
# (proficiency_gating, traps_enabled). This is the first content family whose
# existence is gated on which GameMode is active, not a separate toggle.
#
# The 40 rows below are a curated subset of this checkout's real rare-mob
# roster, not the full set -- researched directly against
# data/sql/base/db_world/creature_template.sql (rank IN (2, 4), i.e.
# CREATURE_ELITE_RAREELITE/CREATURE_ELITE_RARE, the same two ranks the game
# client uses to show the silver-dashed "Rare"/"Rare Elite" nameplate),
# cross-referenced against data/sql/base/db_world/creature.sql to confirm
# each entry has at least one real overworld spawn (map 0/1/530/571 --
# Eastern Kingdoms/Kalimdor/Outland/Northrend), and stratified-sampled by
# minlevel to spread evenly across the full level range and all four
# continents. This produced 40 of 360 real, spawned rank-2/4 rares.
#
# IMPORTANT, documented explicitly rather than silently: "notable"/"famous"
# was NOT used as a selection criterion, because a spot-check during
# curation showed this checkout's data does not reliably match live-retail
# fame -- e.g. Time-Lost Proto-Drake (entry 32153) is rank=1 (plain elite,
# not rank 2/4) in this dataset, and several other well-known Northrend
# rares are rank=2 rather than rank=4. Trusting memory of what's "famous"
# against data that doesn't match memory would have been unverified
# guessing, the exact mistake this project's research discipline exists to
# avoid. The 40 below are therefore an objectively-reproducible sample
# (rank + real spawn existence + even level/continent spread), not a
# hand-picked "greatest hits" list -- a fine substitute for Key Hunt's
# purposes (spec's own framing: "a few dozen rows is enough to prove the
# mode, not an exhaustive server-wide sweep"), but a future task is free to
# replace individual rows with more iconic picks if that's ever desired.
#
# Density-sampled, not always-pooled: locations.py's create_rares_locations
# calls density.sample_category against this full 40-row list (weight 100,
# so only the global check_density and the shared MaxOptionalLocations
# ceiling constrain how many of these 40 are actually used in one
# generation) -- per the plan's own Interfaces note for this task ("Key
# Hunt's rares are sampled through sample_category like any other optional
# category, not hand-picked"). This is the FIRST real caller of Task 2's
# density.py module anywhere in this codebase.
#
# M4.11.1 Task 5 originally added `tags: {zone: [...]}` to every row below
# (a real per-row top-level WoW zone, NOT derived from creature.sql's own
# zoneId/areaId columns -- both are 0 for all 40 of these creature entries
# in this checkout's live DB, confirmed directly: `SELECT id, map,
# position_x, position_y, zoneId, areaId FROM creature WHERE id IN (...)`
# returns zoneId=0/areaId=0 for every single row). `map` IS populated
# correctly (matches each row's existing `# level N, <continent>` comment)
# but is only continent-granularity, already covered by the existing
# MAP_ID_TO_EXPANSION mechanism -- not the zone-level granularity this tag
# needs.
#
# M4.11.3.1 Task 6 replaced that single-winner `zone:` key with the unified
# `tags: {area: [...]}` key every other content family's positional/spatial
# tagging now shares (this same plan's Tasks 1-3): each entry's real (map,
# position_x, position_y) spawn point(s) (queried live, every real row from
# `creature` for that entry, not just one) resolved against this checkout's
# real WorldMapArea.dbc + AreaTable.dbc via tools/db_extract.py's
# resolve_area_tags_for_positions(positions, world_map_areas, area_zone_ids,
# area_names) -- which UNIONS every real zone any of an entity's real spawn
# points falls inside (parse_world_map_areas()'s bounding boxes, each walked
# up to its real top-level zone via parse_area_zone_ids()'s AreaTable.dbc
# parent-chain walk, named via parse_area_names()) rather than picking one
# single "best" winner. This fixes two real problems the old
# resolve_zone_id_from_position (smallest-bounding-box-wins) + hand
# majority-vote mechanism could not: (1) a single spawn position sitting
# inside more than one real overlapping WorldMapArea box (e.g. this
# checkout's Barrens/Durotar/Mulgore boxes genuinely overlap -- only ~10.3%
# of Barrens' own box actually resolves to zone 17 under
# smallest-box-wins, confirmed during this plan's own final whole-branch
# review) now tags EVERY real containing zone instead of one possibly-wrong
# pick; (2) a multi-spawn creature whose real spawns genuinely span more
# than one zone (e.g. Goretooth/entry 17144's 5 real spawns really do span
# Nagrand/Zangarmarsh/Terokkar Forest, not one "true" zone with noisy
# outliers) now tags every zone any spawn falls in, instead of collapsing
# to a single majority-vote winner. rares.yaml has no extract_rares.py of
# its own (this family is hand-curated, per this file's own header above)
# -- these values were computed with a one-off script calling
# resolve_area_tags_for_positions directly against each of the 40
# creature_entry values' real (map, position_x, position_y) rows
# (re-queried live for this task, not reused from M4.11.1 Task 5's stale
# values) and hand-transcribed into the `tags:` blocks below, exactly like
# this file's creature_entry/level/continent values were originally
# hand-curated from creature_template.sql/creature.sql. Re-running the same
# four tools/db_extract.py calls (parse_world_map_areas, parse_area_zone_ids,
# parse_area_names, resolve_area_tags_for_positions) against each of the 40
# creature_entry values' real (map, position_x, position_y) rows reproduces
# every area tag below exactly.
#
# Real effect of the switch, verified against all 40 rows: 18 of 40 rows
# keep exactly the single zone M4.11.1 Task 5 already had (e.g. Lost Soul/
# 1531, Bjarn/1130, Dr. Whitherlimb/22062, Branch Snapper/10641, Antilus the
# Soarer/5347) -- either a genuinely single-zone creature, or (Jalinde
# Summerdrake/8214) the same real zone under its correct canonical string
# (`hinterlands`, matching every other migrated content family's naming, not
# this file's old `the_hinterlands` spelling). The remaining 22 rows widen
# to 2 or 3 area tags where the old single-winner/majority-vote mechanism
# collapsed a real border-ambiguous or genuinely multi-zone creature to one
# zone -- most strikingly Drogoth the Roamer (entry 14231, 2 real spawns),
# which this file's own prior header narrated as resolving to a single
# "Dustwallow Marsh" winner over a near-edge Mulgore near-miss: it now
# correctly tags ['barrens', 'dustwallow_marsh', 'mulgore'], the full real
# union across both spawns (the Barrens/Mulgore/Dustwallow Marsh border
# region genuinely overlaps in this checkout's DBC data); similarly
# Goretooth (entry 17144) now tags ['nagrand', 'terokkar_forest',
# 'zangarmarsh'] (all 3 real candidates its 5 spawns touch, not just the
# old 3-of-5 majority "Nagrand" winner) and Ambassador Jerrikar (entry
# 18695) now tags ['shadowmoon_valley', 'terokkar_forest'] (both real
# candidates its 5 spawns touch, not just the old 3-of-5 majority winner).
# These are real, correct widenings under the new union mechanism, not
# mistakes -- an occasional extra area tag on a border-ambiguous or
# genuinely multi-zone rare is the intended trade documented in
# resolve_area_tags_for_positions's own docstring (an occasional
# false-positive extra zone tag is far cheaper than a real check wrongly
# excluded from a zone-locked Key Hunt pool).
