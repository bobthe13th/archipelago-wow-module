# azerothcore-wotlk/modules/archipelago_wow/content/collections.yaml
family: collections

# Task 27 (design spec Sec5.4, Tier 3: Collector mode). Every collectible
# mount AND companion pet obtainable on this realm's content, per the
# design's own scope. Researched directly against this checkout's own data,
# in three passes, each catching a real mistake before shipping bad data:
#
# 1. item_template.sql's class=15 (ITEM_CLASS_MISC) rows: subclass=5 for
#    mounts, subclass=2 for companion pets (both confirmed empirically
#    against known real items -- entry 18777 "Swift Brown Steed" is
#    class=15/subclass=5, entry 8485 "Cat Carrier (Bombay)" is
#    class=15/subclass=2 -- not assumed from an enum name). This yielded
#    320 raw mount rows and 191 raw pet rows.
#
# 2. item_template.sql in this checkout is NOT scoped to only what this
#    3.3.5a WotLK server can actually deliver -- it carries item rows for
#    content from LATER expansions too (spot-checked: "Celestial Steed" and
#    "X-53 Touring Rocket", both real Cataclysm-era items, are present in
#    this checkout's class=15/subclass=5 rows despite never existing on a
#    genuine WotLK client). Filtered to only items with a REAL, verifiable
#    acquisition path in this checkout's own populated data: sold by a
#    vendor (npc_vendor.item), a quest reward (quest_template's
#    RewardItem1-4/RewardChoiceItemID1-6), or a creature loot drop
#    (creature_loot_template, resolved through reference_loot_template.sql's
#    indirection the same way fish.yaml's research already established).
#    Confirmed both "Celestial Steed" and "X-53 Touring Rocket" are excluded
#    by this filter (no vendor/quest/loot path exists for either in this
#    checkout) while known-real items like "Swift Brown Steed" pass. This
#    narrowed the roster to 201 mounts + 86 pets.
#
# 3. The real "you have learned this mount/companion" event needs the
#    SPELL this item teaches, not the item itself (Player::LearnSpell is
#    what actually happens; see the C++ hook comment in
#    ArchipelagoCollectionScript.cpp). item_template's spellid_1 turned out
#    to be a red herring -- nearly every mount/pet item shares the SAME
#    spellid_1 value (55884), which src/server/game/Entities/Item/
#    ItemTemplate.h's ITEM_SPELLTRIGGER_LEARN_SPELL_ID comment explains:
#    "used in item_template.spell_2 with spell_id with SPELL_GENERIC_LEARN
#    in spell_1" -- spellid_1/55884 is a shared generic wrapper, and the
#    REAL taught spell is whichever spell slot (1-5) has spelltrigger==6
#    (ITEM_SPELLTRIGGER_LEARN_SPELL_ID), confirmed against
#    src/server/game/Entities/Item/ItemTemplate.h directly rather than
#    assumed from the first spell slot. This is exactly the "verify against
#    this specific checkout, don't guess from a plausible-looking field"
#    mistake this project's research discipline exists to catch -- caught
#    here by noticing 266 mounts implausibly sharing one spell id before
#    ever writing this file, the same discipline that caught Task 26's
#    backslash-escaped-apostrophe parsing bug and Time-Lost Proto-Drake's
#    rank mismatch earlier this session.
#
# A small number of items (18 mount rows, several pet rows) teach the
# IDENTICAL spell as another item in the roster -- e.g. a quest-reward copy
# and a separate vendor-bought copy of visually the same mount. Deduplicated
# by spell id (not item id) down to one canonical item per unique spell,
# since WoW itself does not distinguish which item taught an already-known
# mount/companion spell -- keeping both as separate "collectible" locations
# would let learning ONE real item simultaneously complete two AP locations,
# which does not model "collect each item" accurately. A separate handful of
# names repeat across two DIFFERENT item entries with two DIFFERENT taught
# spells -- real faction-mirrored mounts sharing an identical display name
# in item_template -- disambiguated by appending the item's own entry id in
# parens (deterministic, not an unverified faction guess). Final roster: 184
# mounts + 80 pets = 264 total.
