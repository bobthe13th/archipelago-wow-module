  STARTING_LEVEL_CAP: 10
  LEVEL_CAP_STEP: 5
  SPRINT_GOAL_LEVEL: 60

# Task 24 (Completionist mode, design spec Sec5.4): instance_clear rows now
# carry an `expansion: vanilla|tbc|wotlk` field, driving
# INSTANCES_BY_EXPANSION (generate_content.py) and goals.py's Completionist
# validator/completion rule. Optional in the loader's schema (a soft
# tightening, not a breaking change -- older rows just needed the field
# added, not restructured), but every instance_clear row here has one in
# practice as of this task.
