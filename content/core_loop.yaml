# azerothcore-wotlk/modules/archipelago_wow/content/core_loop.yaml
family: core_loop

constants:
  LEVEL_CAP_STEP: 1
  SPRINT_GOAL_LEVEL: 60
  # STARTING_LEVEL_CAP removed as a single flat value -- now derived
  # per-track (level_cap_tracks below) since Zone Leveler's own track
  # (Task 9) needs a different starting cap/ceiling than the shared
  # standard/death_knight tracks. See generate_content.py's
  # _emit_python_core_loop / _emit_cpp_core_loop for the STARTING_LEVEL_CAP_BY_TRACK
  # / LEVEL_CAP_TOTAL_BY_TRACK dicts this produces.

# M4.11.1 (Task 3): per-track starting Progressive Level Cap value. Each
# track's own ceiling (used to compute LEVEL_CAP_TOTAL_BY_TRACK) is derived
# from that track's own max level_milestone level in `locations:` below --
# only the starting cap needs authoring here, since a track's lowest
# level_milestone location is NOT reliably one-above the starting cap (the
# standard/death_knight tracks both still emit "Reach Level N" locations
# for every level from 1 (standard) / 55 (death_knight) upward, including
# levels below the real starting cap, as free/no-item-required checks).
level_cap_tracks:
  standard: {starting_level_cap: 10}
  death_knight: {starting_level_cap: 10}
  # M4.11.1 (Task 9): Zone Leveler's Barrens track. Its own min_level is 10
  # (zone_leveler_content_data.ZONES["barrens"].min_level) -- matches the
  # starting cap used by standard/death_knight above, purely coincidentally
  # (Barrens' own design spec calls for a level-10 floor). The track's total
  # pooled-copy count is derived automatically from this starting cap and
  # the track's own max level_milestone row below (30): 30 - 10 = 20.
  zone_leveler_barrens: {starting_level_cap: 10}

# Task 24 (Completionist mode, design spec Sec5.4): instance_clear rows now
# carry an `expansion: vanilla|tbc|wotlk` field, driving
# INSTANCES_BY_EXPANSION (generate_content.py) and goals.py's Completionist
# validator/completion rule. Optional in the loader's schema (a soft
# tightening, not a breaking change -- older rows just needed the field
# added, not restructured), but every instance_clear row here has one in
# practice as of this task.
locations:
  # M4.9 (spec Sec3): every-level granularity (was every 5th level: 5,
  # 10, 15, ... 60) plus a real per-class track split. Two tracks now
  # exist, each row's trigger carrying a `track: standard|death_knight`
  # field: "standard" (every class except Death Knight, levels 1-80)
  # and "death_knight" (Death Knight only, levels 55-80, matching the
  # class's real Player::Create starting level). generate_content.py
  # groups these into LEVEL_LOCATIONS_BY_TRACK (Python) /
  # LEVEL_LOCATIONS_STANDARD + LEVEL_LOCATIONS_DEATH_KNIGHT (C++),
  # mirroring the INSTANCES_BY_EXPANSION grouping precedent below.
  # Location ids were fully renumbered (710000+level for standard,
  # 711000+level for death_knight) rather than preserving the old
  # 710000-710011 range -- the granularity change alone already forced a
  # full regeneration of this block, so a clean, self-documenting id
  # scheme was chosen over preserving now-meaningless old ids for 12 of
  # the new 106 rows.
