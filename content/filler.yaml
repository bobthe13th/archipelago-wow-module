# azerothcore-wotlk/modules/archipelago_wow/content/filler.yaml
family: filler

# Sink locations restoring item=location parity after Group 1's gate items
# (Task 11, §16's "gate-item sphere-0 test"), Group 3's trap items (Task
# 17), and M4.10.7's Holidaysanity items (no location of their own, same
# shape as gates/traps). A single generation only USES as many of these
# rows as items.py's count_enabled_gates_items + count_enabled_trap_items +
# count_enabled_holidaysanity_items finds pooled for that generation's
# options (locations.py's create_filler_locations slices this list to that
# combined count). AP's generation pipeline has no
# generic step that pads a short itempool to match location count (the
# only itempool<->create_filler() interaction in Main.py is a fixed-size
# 1:1 swap for start_inventory_from_pool removals, not padding), so every
# option combination needs true 1:1 item/location parity, confirmed
# empirically: distribute_items_restrictive raises "Unable to fill all
# locations" just as readily when locations exceed items as it does the
# reverse. A fixed "worst-case slack" location count (every row always
# created) was tried first and was wrong for exactly this reason.
#
# Row count: 122 = 37 (len(gates_content_data.ITEMS), real count as of
# M4.10.1) + 85 (the trap ceiling as of M4.10.1 -- see below). This is a
# 73->122 resize (+49 rows, Filler Check 74-122 / location_id 740073-740121)
# fixing the drift M4.9's header note above had already flagged as
# out-of-scope-for-that-plan-but-expected: M4.9.3's per-level-milestone
# granularity grew the standard track's core_loop level-milestone count
# to 80 (from 12), which pushed _trap_baseline_location_count()'s standard-
# track total to 85 (80 level milestones + 5 instance clears) -- the larger
# of the two tracks (death_knight: 26 + 5 = 31) and therefore the one that
# sets the ceiling, per _trap_baseline_location_count()'s own
# track-max-of-standard-vs-dk sizing. That 85, combined with gates growing
# from 29 to 37 since this file was last resized (M4.9's 8 new gate items:
# Bank Access, Gathering Access, 6x Progressive Glyph Slot), is what
# TestFillerPoolCoversWorstCaseGatesAndTraps caught as a 73-vs-122 (-49)
# shortfall.
#
# M4.10.7: Row count grown 122 -> 136 = 37 (gates) + 85 (traps, unchanged)
# + 14 (len(holidaysanity_content_data.ITEMS), Holidaysanity's own worst
# case when combo_unlocks_scope is "both" -- every Holiday Unlock item
# pooled, including the 5 combo-scope-gated ones). Filler Check 123-136 /
# location_id 740122-740135 are the +14 rows added for this resize. See
# items.py's count_enabled_holidaysanity_items docstring for why
# Holidaysanity needs the exact same sink-location treatment as gates/traps.
#
# M4.11.1 (Task 4, BarrensBeater): Row count grown 136 -> 139 = 37 (gates)
# + 88 (traps, grown from 85) + 14 (holidaysanity, unchanged). The trap
# ceiling grew because _trap_baseline_location_count() (items.py) sizes
# itself off len(core_loop_content_data.INSTANCE_CLEAR_LOCATIONS), which
# this task grew from 5 to 8 (Wailing Caverns/Razorfen Kraul/Razorfen Downs
# added to core_loop.yaml) -- exactly the "any future core_loop.yaml...
# instance-clear count" drift this file's own trip-wire note above already
# anticipated. Standard track's own baseline is still the larger of the two
# (88 = 80 level milestones + 8 instance clears vs. death_knight's 34 = 26 +
# 8), so it remains the one that sets count_enabled_trap_items's ceiling.
# Filler Check 137-139 / location_id 740136-740138 are the +3 rows added for
# this resize.
#
# M4.11.4.2 (Task 4 final-review fix wave 2, Fix 4): Row count grown
# 139 -> 151 = 37 (gates) + 88 (traps, unchanged) + 14 (holidaysanity,
# unchanged) + 12 (Progressive Mining/Herbalism, items.py's
# count_gathering_skill_progression_items -- one copy per real skill tier
# with at least one real gathering_node location, 6 tiers x 2 professions
# in this checkout's real regenerated content). Neither Progressive item
# has an AP location of its own (same "no location of its own" shape as
# gates/traps/holidaysanity), so locations.py's create_filler_locations
# already added a 5th `needed` term for this family (M4.11.4.2 fix round 1)
# -- but this row-count resize was missed at the time, so every generation
# silently truncated 12 filler locations short of that `needed` total
# (`list(...)[:needed]` on a too-short list truncates rather than raising),
# breaking item/location parity by exactly 12 the moment Task 5 regenerated
# real zone_pool_credit content. Caught by the whole-milestone final review's
# full local pytest run (TestTrapsGatesAndHolidaysanityCombinedParity /
# TestNorthshireGeneration::test_default_item_pool_size), not by
# TestFillerPoolCoversWorstCaseGatesTrapsAndHolidaysanity -- that trip-wire's
# own assertion also didn't have a term for this family yet (fixed alongside
# this resize, see test_basic.py). Filler Check 140-151 / location_id
# 740139-740150 are the +12 rows added for this resize.
#
# History of this file's prior sizings, kept for context:
# - 29 (len(gates_content_data.ITEMS) as of Tasks 5-10 + Task 21's 2
#   combo-unlock items) + 33 (trap ceiling as of Task 17, before Task 23's
#   instance-clear growth) = 62.
# - Task 23 grew core_loop.yaml's INSTANCE_CLEAR_LOCATIONS from 2 to 5
#   (Molten Core/Sunwell Plateau/Icecrown Citadel), raising the trap
#   ceiling from 33 to 36 (29 + 36 = 65).
# - M4.9's 8 new gate items raised gates from 29 to 37, but the trap
#   ceiling's own drift (36 -> 85, from M4.9.3's per-level-milestone
#   granularity) was NOT applied at that time, leaving the pool sized to
#   an already-stale 73 (37 + 36) instead of the true 122 (37 + 85) --
#   the gap this M4.10.1 resize closes.
#
# _trap_baseline_location_count() (items.py) is track-aware and takes
# max(standard, death_knight) implicitly by construction -- whichever
# track's core_loop.yaml location count is larger at generation time sets
# count_enabled_trap_items's ceiling at trap_percentage_of_filler's Range
# max of 100. Any future optional item family, OR any future core_loop.yaml
# growth (per-track level-milestone count or instance-clear count), must
# extend this ceiling by its own worst-case count the same way, not assume
# 136 is permanent -- TestFillerPoolCoversWorstCaseGatesAndTraps is the
# trip-wire test that catches the next drift.
#
# items: [] always for this family (a filler location has no matching item
# of its own, by definition) -- kept for schema-shape parity with
# gates.yaml's `locations: []`.
items: []

