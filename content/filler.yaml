# azerothcore-wotlk/modules/archipelago_wow/content/filler.yaml
family: filler

# Sink locations restoring item=location parity after Group 1's gate items
# (Task 11, §16's "gate-item sphere-0 test"). 27 rows -- the maximum
# possible, len(gates_content_data.ITEMS) as of Tasks 5-10 -- but a single
# generation only USES as many of these as items.py's
# count_enabled_gates_items finds pooled for that generation's options
# (locations.py's create_filler_locations slices this list to that count).
# AP's generation pipeline has no generic step that pads a short itempool
# to match location count (the only itempool<->create_filler() interaction
# in Main.py is a fixed-size 1:1 swap for start_inventory_from_pool
# removals, not padding), so every option combination needs true 1:1
# item/location parity, confirmed empirically: distribute_items_restrictive
# raises "Unable to fill all locations" just as readily when locations
# exceed items as it does the reverse. A fixed "worst-case slack" location
# count (every row always created) was tried first and was wrong for
# exactly this reason. items: [] always for this family (a filler location
# has no matching item of its own, by definition) -- kept for schema-shape
# parity with gates.yaml's `locations: []`.
items: []

locations:
