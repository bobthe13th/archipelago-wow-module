# azerothcore-wotlk/modules/archipelago_wow/content/filler.yaml
family: filler

# Sink locations restoring item=location parity after Group 1's gate items
# (Task 11, §16's "gate-item sphere-0 test") and Group 3's trap items (Task
# 17). A single generation only USES as many of these rows as items.py's
# count_enabled_gates_items + count_enabled_trap_items finds pooled for
# that generation's options (locations.py's create_filler_locations slices
# this list to that combined count). AP's generation pipeline has no
# generic step that pads a short itempool to match location count (the
# only itempool<->create_filler() interaction in Main.py is a fixed-size
# 1:1 swap for start_inventory_from_pool removals, not padding), so every
# option combination needs true 1:1 item/location parity, confirmed
# empirically: distribute_items_restrictive raises "Unable to fill all
# locations" just as readily when locations exceed items as it does the
# reverse. A fixed "worst-case slack" location count (every row always
# created) was tried first and was wrong for exactly this reason.
#
# Row count: 62 = 29 (len(gates_content_data.ITEMS) as of Tasks 5-10 + Task
# 21's 2 combo-unlock items) + 33 (the absolute ceiling on
# count_enabled_trap_items -- Task 17's trap_percentage_of_filler Range tops
# out at 100, and _trap_baseline_location_count() is a fixed 33 quest+core-loop
# locations, so 33 is the largest total items.py's create_trap_item_pool can
# ever produce in one generation). Any future optional item family (Group 6's
# new content, per Task 11's outcome note) must extend this ceiling by its
# own worst-case count the same way, not assume 62 is permanent.
#
# items: [] always for this family (a filler location has no matching item
# of its own, by definition) -- kept for schema-shape parity with
# gates.yaml's `locations: []`.
items: []

