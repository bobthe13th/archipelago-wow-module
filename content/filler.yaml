# azerothcore-wotlk/modules/archipelago_wow/content/filler.yaml
family: filler

# Sink locations restoring item=location parity after Group 1's gate items
# (Task 11, §16's "gate-item sphere-0 test") and Group 3's trap items (Task
# 17). A single generation only USES as many of these rows as items.py's
# count_enabled_gates_items + count_enabled_trap_items finds pooled for
# that generation's options (locations.py's create_filler_locations slices
# this list to that combined count). AP's generation pipeline has no
# generic step that pads a short itempool to match location count (the
# only itempool<->create_filler() interaction in Main.py is a fixed-size
# 1:1 swap for start_inventory_from_pool removals, not padding), so every
# option combination needs true 1:1 item/location parity, confirmed
# empirically: distribute_items_restrictive raises "Unable to fill all
# locations" just as readily when locations exceed items as it does the
# reverse. A fixed "worst-case slack" location count (every row always
# created) was tried first and was wrong for exactly this reason.
#
# Row count: 73 = 37 (29 + M4.9's 8 new gate items: Bank Access, Gathering
# Access, 6x Progressive Glyph Slot) + 36 (the trap ceiling AS OF WHEN THIS
# ROW COUNT WAS LAST SIZED -- NOTE: this baseline has since drifted from 36
# due to an unrelated, separate milestone's per-level-milestone change to
# items.py's _trap_baseline_location_count(); resizing this filler pool to
# the current real ceiling is out of scope for this plan and is expected to
# be handled by whichever effort is already tracking that drift) -- see
# below for the original 29 (len(gates_content_data.ITEMS) as of Tasks 5-10 +
# Task 21's 2 combo-unlock items) + 36 (the absolute ceiling on
# count_enabled_trap_items -- Task 17's trap_percentage_of_filler Range tops
# out at 100, and _trap_baseline_location_count() sums
# len(content_data.LOCATIONS) [19 quest locations] +
# len(core_loop_content_data.LEVEL_LOCATIONS) [12] +
# len(core_loop_content_data.INSTANCE_CLEAR_LOCATIONS) [5, grown from 2 by
# Task 23's three new raid instance-clear rows -- this baseline is NOT fixed,
# it grows whenever core_loop.yaml gains an instance_clear row, so 36 is not
# the last time this needs to move either], so 36 is the largest total
# items.py's create_trap_item_pool can produce in one generation today. Any
# future optional item family, OR any future core_loop.yaml growth (Group 6's
# new content, per Task 11's outcome note and Task 23's real discovery of
# this cross-family coupling), must extend this ceiling by its own worst-case
# count the same way, not assume 65 is permanent.
#
# items: [] always for this family (a filler location has no matching item
# of its own, by definition) -- kept for schema-shape parity with
# gates.yaml's `locations: []`.
items: []

