# One item per milestone location, using a new realm_state effect
# (record_milestone) that just sets a generic flag-store entry keyed by
# milestone_key -- reuses the same generic-flag-store mechanism this
# session already established for Key Hunt's key counter, Task 23's
# instance-clear-sent guard, and Task 26's fish_received tracking, rather
# than inventing a 5th ad-hoc realm-state mechanism. No real WoW item to
# mail exists for "you reached skill 225 in Blacksmithing" the way
# Task 26's fish items had a natural real-item target, so these are pure
# AP-side progression markers with no in-game delivery effect.
