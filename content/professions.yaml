# azerothcore-wotlk/modules/archipelago_wow/content/professions.yaml
family: professions

# Task 27 (design spec Sec5.4, Tier 3: Artisan mode). All 14 professions
# named in the design's own scope ("every profession -- both primary-
# profession slots plus secondary professions -- First Aid, Cooking,
# Fishing -- to its WotLK-era skill cap (450)") -- 11 primary (Alchemy,
# Blacksmithing, Enchanting, Engineering, Herbalism, Inscription,
# Jewelcrafting, Leatherworking, Mining, Skinning, Tailoring) + 3 secondary
# (First Aid, Cooking, Fishing). Skill line ids sourced from THIS checkout's
# own compiled server code (src/server/shared/SharedDefines.h's SkillType
# enum), not memory or assumption -- the same "verify against this specific
# checkout" discipline as every hook/id in this plan, applied here after
# discovering that data/sql/base/db_world's *_dbc.sql tables (which would
# normally carry SkillLine.dbc data) are empty stub schemas in this
# checkout (confirmed: achievement_dbc, achievement_criteria_dbc,
# areatable_dbc, and several others all have zero data rows -- this
# checkout never populated its DBC-derived SQL tables, and no binary .dbc
# client files exist in the repo either). SharedDefines.h's enum was the
# one place these ids were verifiably real for THIS checkout, since the
# server's own gameplay logic depends on them being correct.
#
# Six milestone thresholds per profession (75/150/225/300/375/450, the
# skill-point breakpoints WoW itself uses for recipe-tier gating) rather
# than one location per skill point -- 84 locations total (14 x 6), a
# deliberate granularity choice, not a data limitation like Task 26's
# fish-region heuristic.
#
# `category: primary|secondary` on each trigger drives goals.py's
# completion rule -- see the KNOWN ACCEPTED LIMITATION below for why.
# Location names ("Profession: <name> <threshold>", the in-game skill-up
# trigger) and item names ("Skill Milestone: <name> <threshold>", the
# AP-side collectible) are deliberately distinct strings, matching
# fish.yaml's "Fish Catch: X" vs "Fish: X" precedent -- items and locations
# share a namespace in this content-table schema and must never collide.
#
# KNOWN ACCEPTED LIMITATION, documented rather than silently shipped: a
# single WotLK character can only actively know 2 of the 9 gathering/
# crafting PRIMARY professions at once (unlearning and relearning a third
# is possible but grindy) -- reaching all 9 primary professions' 450 cap
# simultaneously is not achievable on one character without significant
# profession-swapping. This mirrors the DK level-55 reachability gap
# already accepted for core_loop.yaml (locations.py's own comment) -- the
# content and locations are all real and correctly modeled, but full
# completion in the sense of "every location checked by one character" is
# impractical, not impossible. Artisan's own completion rule (goals.py)
# accounts for this by requiring only a configurable N of the 9 primaries
# (default matching the realistic 2-profession limit) rather than all 9,
# alongside all 3 secondary professions (always simultaneously reachable).
