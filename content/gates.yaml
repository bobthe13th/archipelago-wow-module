  # Access gating (Task 8, §5.1 -- optional, off by default; only pooled
  # when the "access_gating" apworld option is on). Researched against this
  # checkout's real hook surface before writing rows (per finding #10's
  # precedent): only 3 of the 5 access types named in the design spec have
  # an actual interception point --
  #   - Auction House: WorldSession::HandleAuctionHelloOpcode calls
  #     sScriptMgr->CanSendAuctionHello (MiscScript::CanSendAuctionHello) --
  #     gates opening the AH window.
  #   - Hearthstone: gated via the same PLAYERHOOK_CAN_USE_ITEM hook as
  #     Tasks 5/7, keyed on the real Hearthstone item entry (6948, spell
  #     8690 -- confirmed directly in src/server/game/Spells/SpellEffects.cpp).
  #   - Mailbox: gated via PLAYERHOOK_CAN_SEND_MAIL (Player::CanSendMail),
  #     which only fires from player-initiated opcode paths -- confirmed
  #     this module's own AP item delivery (APDelivery.cpp) builds a
  #     MailDraft and calls SendMailTo() directly, a separate server-side
  #     API that never touches this hook, so gating it cannot block AP's own
  #     delivery mail. Covers both composing new mail AND returning existing
  #     mail to its sender (MailHandler.cpp's HandleReturnToSender also
  #     calls this same hook) -- reading/collecting mail into your inbox is
  #     the only mailbox action that stays open always (no hook exists on
  #     HandleGetMailList).
  # Bank and gathering (mining/herbalism/skinning) have NO ScriptMgr hook
  # anywhere in their interaction path (confirmed by grepping BankHandler.cpp,
  # Player::GetNPCIfCanInteractWith, and GameObject.cpp's Use() path -- zero
  # sScriptMgr calls in any of them). Adding one would mean patching
  # AzerothCore core engine files, which is out of scope for this module-only
  # plan; both are deferred as a named follow-on rather than invented here.
  - name: "Auction House Access"
    item_id: 830015
    count: 1
    delivery: {kind: flag, flag_key: access_auction_house, tier: 1}
  - name: "Hearthstone Access"
    item_id: 830016
    count: 1
    delivery: {kind: flag, flag_key: access_hearth, tier: 1}
  - name: "Mailbox Access"
    item_id: 830017
    count: 1
    delivery: {kind: flag, flag_key: access_mailbox, tier: 1}

  # Character-unlock gating (Task 10, §5.1 -- optional, off by default; only
  # pooled when the "character_unlock_gating" apworld option is on). Unlike
  # every gate above, these don't fit the pure "check a realm flag on every
  # relevant action" pattern -- researched per-item against this checkout
  # before assuming a shape (bank slots/dual spec turned out to need one
  # shape, talent points another):
  #   - Progressive Bank Bag Slot (flag_key bank_bag_slots, tiers 1-7,
  #     matching Player.h:702's `enum BankBagSlots // 7 slots`): grant-based,
  #     not suppression. DeliverArchipelagoItems applies
  #     Player::SetBankBagSlotCount(max(current, tier)) to every online
  #     character on receipt, and ArchipelagoPlayerScript's existing
  #     PLAYERHOOK_ON_LOGIN sync-applies the same monotonic-max on login for
  #     characters that were offline when the item arrived -- mirrors how
  #     RaiseLevelCap already needs both an online-apply and a login-time
  #     reapply, except level cap is a single global sWorld config value and
  #     this is a genuinely per-character saved field (PLAYER_BYTES_2), the
  #     first time this module has needed that.
  #   - Dual Spec Unlock (flag_key dual_spec, tier 1 boolean): same
  #     grant-based/login-synced shape, but calls the real
  #     Player::UpdateSpecCount(2) API (confirmed at
  #     PlayerUpdates.cpp:2198+2242) rather than the raw SetSpecsCount
  #     setter directly -- that function also copies/clears per-spec action
  #     bars and calls SendTalentsInfoData(false) to sync the client, which
  #     a bare setter call would skip.
  #   - Talent Point Access (flag_key access_talent_points, tier 1 boolean):
  #     the one item in this family that IS continuous suppression, not a
  #     grant -- named "Access" (not "Progressive"/"Unlock") to match that.
  #     Gated via PLAYERHOOK_CAN_LEARN_TALENT (Player::LearnTalent, confirmed
  #     real and boolean-returning at Player.cpp:14281), blocking every
  #     talent point spend realm-wide until received.
  # Glyph Slot: Major/Minor (also named in the design spec's example) is
  # deferred, not shipped: PLAYER_FIELD_GLYPH_SLOTS_1 is a per-slot-index
  # field but m_Glyphs is declared as [MAX_TALENT_SPECS][MAX_GLYPH_SLOT_INDEX]
  # (Player.h:2880), and it wasn't verified in the time available whether
  # slot *availability* is genuinely spec-independent or needs per-spec
  # handling -- shipping an unverified per-character field mutation is the
  # kind of invented behavior this plan avoids elsewhere (see Task 7's
  # proficiency-data research standard).
  - name: "Progressive Bank Bag Slot: Slot 1"
    item_id: 830018
    count: 1
    delivery: {kind: flag, flag_key: bank_bag_slots, tier: 1}
