  # Armor/weapon proficiency gating (Task 7, §5.1 -- optional, off by
  # default; only pooled when the "proficiency_gating" apworld option is on,
  # see items.py's create_gates_item_pool). Bounded to the classMask-only
  # subset of real playercreateinfo_skills rows (verified against this
  # checkout's data/sql/base/db_world/playercreateinfo_skills.sql) that
  # don't also require a raceMask (Bows/Crossbows/Guns/Daggers/Two-Handed
  # Maces are granted per race+class combos in vanilla and are explicitly
  # deferred, along with Shield/Polearms/Swords/Two-Handed Axes/Thrown, as a
  # follow-on rather than invented here). Cloth (free to every class) is
  # never gated, so a fresh character can always equip something -- sphere-0
