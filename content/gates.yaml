  # Random Flight Path Unlock (Task 4, M4.14.1 "Useful Items"). Grant-shaped,
  # not flag-shaped: unlike every other item in this family, receipt
  # immediately grants one uniformly-random previously-unknown real taxi
  # node (sTaxiNodesStore) to the delivery character via
  # PlayerTaxi::SetTaximaskNode -- see GrantRandomTaxiNode in
  # ArchipelagoPlayerScript.cpp. item_id 830043-830044 were reserved for
  # Task 6 -- see the Progressive EXP/Move-Speed Boost items below.
  - name: "Random Flight Path Unlock"
    item_id: 830045
    count: 1
    delivery: {kind: grant_random_taxi_node}

  # Portable Mailbox (Task 5, M4.14.1 "Useful Items"). A real, mailable
  # consumable item (wow_item_entry 850104, a custom item_template row --
  # see data/sql/updates/pending_db_world/) whose spellid_1 is bound to
  # spell 5735 ("REUSE", a real, empirically-verified single-SPELL_EFFECT_
  # DUMMY placeholder spell shipped in Blizzard's own Spell.dbc, unused by
  # any other item_template row or src/server/scripts/ SpellScript in this
  # checkout) -- see ArchipelagoPortableMailboxScript.cpp's
  # spell_archipelago_portable_mailbox for the real on-use effect (summons
  # gameobject_template entry 850200, a despawn-timed clone of the real
  # static mailbox row 32349). Uses the same `mail` delivery kind every
  # other "just hand over a real WoW item" family already uses; the
  # "gates" family's own C++ emitter (_emit_cpp_gates) was extended to
  # also emit Archipelago::Gates::ApItemIdToWowItemEntry for this and any
  # future mail-kind gates item, since gates was otherwise an all-flag
  # family with no such map before this task.
  - name: "Portable Mailbox"
    item_id: 830046
    count: 1
    delivery: {kind: mail, wow_item_entry: 850104}

  # Progressive EXP/Move-Speed Boost (Task 6, M4.14.1 "Useful Items").
  # Flag-shaped, applied as a permanent login aura in
  # Archipelago::Gating::SyncCharacterUnlocksToPlayer (APGating.cpp), the
  # same login-sync function that already handles bank_bag_slots/dual_spec
  # above -- not a new login hook. Real, spot-verified spell ids (see this
  # task's own report for the full DBC field-offset calibration and
  # zero-reference check against item_template.spellid_1..5,
  # spell_script_names, playercreateinfo_cast_spell, spell_area, and
  # src/server/scripts/): spell 42138 "Brewfest Enthusiast" (single-effect
  # SPELL_AURA_MOD_XP_PCT, EffectBasePoints[0]=9, ~10%) for xp_boost; spell
  # 22587 "8% speed bonus" (single-effect SPELL_AURA_MOD_INCREASE_SPEED,
  # EffectBasePoints[0]=7, ~8%) for speed_boost. Both are simple flat-
  # percentage passive auras with no stacking/proc side effects, so
  # Player::AddAura re-applying an already-present aura on every login is a
  # harmless idempotent refresh. Drop-rate is explicitly out of scope per
  # the design spec.
  - name: "Progressive EXP Boost"
    item_id: 830043
    count: 1
    delivery: {kind: flag, flag_key: xp_boost, tier: 1}
  - name: "Progressive Move Speed Boost"
    item_id: 830044
    count: 1
    delivery: {kind: flag, flag_key: speed_boost, tier: 1}

