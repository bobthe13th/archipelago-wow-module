  # Glyph Slot (M4.9): Player::InitGlyphsForLevel() (Player.cpp) confirmed
  # real -- iterates sGlyphSlotStore (GlyphSlot.dbc), calling
  # SetGlyphSlot(gs->Order - 1, gs->Id) per row. Confirmed this field
  # (PLAYER_FIELD_GLYPH_SLOTS_1 + slot, via SetGlyphSlot/GetGlyphSlot) is
  # NOT spec-indexed -- unlike the actually-socketed glyph itself
  # (m_Glyphs[m_activeSpec][slot], PLAYER_FIELD_GLYPHS_1), slot
  # *availability* is realm-character-wide, resolving the "wasn't verified
  # in the time available" caveat this comment used to carry. WotLK's own
  # level-gating bitmask inside InitGlyphsForLevel (levels 15/30/50/70/80,
  # bits 0x01|0x02|0x08|0x04|0x10|0x20) confirms exactly 6 real glyph slots
  # total, tiered the same progressive way as Progressive Bank Bag Slot
  # above -- gated via the same weak extern function-pointer hook shape as
  # Bank Access, wrapping each SetGlyphSlot call (see Player.cpp/
  # APGating.cpp/APGateDecision.h).
