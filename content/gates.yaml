  # Access gating (Task 8, §5.1; M4.9 closed the bank/gathering gap). All 5
  # of the design's access types now have a real interception point --
  #   - Auction House: WorldSession::HandleAuctionHelloOpcode calls
  #     sScriptMgr->CanSendAuctionHello (MiscScript::CanSendAuctionHello) --
  #     gates opening the AH window.
  #   - Hearthstone: gated via the same PLAYERHOOK_CAN_USE_ITEM hook as
  #     Tasks 5/7, keyed on the real Hearthstone item entry (6948, spell
  #     8690 -- confirmed directly in src/server/game/Spells/SpellEffects.cpp).
  #   - Mailbox: gated via PLAYERHOOK_CAN_SEND_MAIL (Player::CanSendMail).
  #   - Bank (M4.9): BankHandler.cpp::HandleBankerActivateOpcode has no
  #     ScriptMgr hook of its own, so this is gated via a weak extern
  #     function-pointer hook the module sets at script-load time instead --
  #     see APGating.cpp/APGateDecision.h and BankHandler.cpp.
  #   - Gathering (M4.9, covers mining/herbalism/skinning as one access
  #     type): gated via ALLSPELLHOOK_CAN_PREPARE, checking the real
  #     Lock.dbc skill requirement of the target GameObject (mining/
  #     herbalism) or SPELL_EFFECT_SKINNING structurally (skinning) -- see
  #     ArchipelagoGatheringGateScript in APGating.cpp. This turned out
  #     feasible after all, reversing this comment's own earlier "no
  #     ScriptMgr hook anywhere in their interaction path" finding, which
  #     was correct about BankHandler.cpp/GameObject.cpp's Use() path but
  #     missed that gathering is triggered via a spell cast, not a raw
  #     opcode/Use() call.
  - name: "Auction House Access"
    item_id: 830015
    count: 1
    delivery: {kind: flag, flag_key: access_auction_house, tier: 1}
  - name: "Hearthstone Access"
    item_id: 830016
    count: 1
    delivery: {kind: flag, flag_key: access_hearth, tier: 1}
  - name: "Mailbox Access"
    item_id: 830017
    count: 1
