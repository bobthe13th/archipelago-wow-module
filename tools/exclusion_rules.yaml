# Hand-maintained denylist for DB-extracted content families (Group 1-4 of
# the M4.5 plan). Unlike content/*.yaml (generated, do not hand-edit), this
# file IS meant to be hand-edited as new junk/test/GM-only rows are found in
# future extraction runs -- add a pattern here, don't special-case it in an
# extraction script.
name_denylist:
  - '(?i)\btest\b'
  - '(?i)\bqa\b'
  - '(?i)\bdeprecated\b'
  - '(?i)\bunused\b'
  - '(?i)\bnot used\b'
  - '(?i)\bdo not use\b'
  - '(?i)\bdebug\b'
  - '(?i)\bgm[ _]'
  - '(?i)\bdeveloper\b'
  - '(?i)\binvalid\b'
  - '(?i)\bdnt\b'
  # Placeholder tag, e.g. "[PH] Hakkar'i Urn" / "Ahn'Qiraj Wand [PH]" --
  # 141 real rows verified live, all internal/unfinished-art placeholder
  # items, none player-facing (M4.9.3.1 final review fix).
  - '(?i)\[PH\]'
  # "OLD" glued directly onto the next word with no space, e.g.
  # "OLDRecruit's Belt", "OLDMonster - Mace, Standard Basic Offhand" -- the
  # \bunused\b-style word-boundary patterns above don't catch this (no
  # boundary between "OLD" and the following capital letter). Anchored at
  # the start of the name and requires a letter to immediately follow, so
  # real items that legitimately use "Old " as a normal adjective (e.g.
  # "Old Greatsword", "Old Gods' Blessing", "Old Whitebark's Pendant") are
  # NOT matched -- verified live: 53 rows match a bare 'OLD%' prefix, of
  # which exactly the ones with no space after OLD (this pattern's target)
  # are internal starter-gear/totem/monster-model duplicates; every
  # space-separated "Old <Name>" row is real, player-facing content
  # (M4.9.3.1 final review fix).
  - '(?i)^OLD[A-Z]'
  # "zz" prefix glued directly onto the next word with no space, e.g.
  # "zzDEPRECATED..." -- same issue as the OLD[A-Z] pattern above. The
  # existing \bdeprecated\b word-boundary pattern doesn't catch these
  # because there's no boundary between "zz" and the following capital
  # letter. Anchored at the start and requires a letter to follow.
  # Verified live: 39 rows match this pattern (entry<4000000 universe),
  # all internal test/deprecated items -- e.g. zzOLD.../ZZOLD.../
  # zzDEPRECATED.../zzoldSwift Warstrider (M4.10.6 itemsanity fix;
  # count corrected during scoped re-review after an initial
  # under-count of 5).
  - '(?i)^zz[A-Z]'
  # Internal NPC-only visual equipment, e.g. "NPC Equip 18732" -- verified
  # live: 4,856 rows all conform exactly to the "NPC Equip <digits>" shape,
  # none player-facing (M4.9.3.1 final review fix).
  - '(?i)\bNPC Equip\b'
  # Numeric-prefixed internal GM-testing gear naming, e.g. "90 Green
  # Warrior Axe", "68 TEST Green Cloth Belt", "130 Test Caster Belt" -- a
  # common AzerothCore/TrinityCore convention for level/quality/class
  # test items. Verified live against all 225 real rows matching a bare
  # "^[0-9]+ " prefix: the only real, player-facing rows in that set use
  # a unit word right after the number ("10 Pound Mud Snapper", "500
  # Pound Chicken", "2 Stone Sledgehammer" -- 38 rows); every row whose
  # second word is "TEST"/"Test"/"Green"/"Epic" (187 rows) is internal
  # test gear, so anchoring on those specific second words (rather than
  # any numeric prefix) avoids excluding the real fish/novelty items
  # (M4.9.3.1 final review fix).
  - '(?i)^\d+\s+(?:test|green|epic)\b'
  # Internal monster-weapon/prop model naming, e.g. "Monster - Sword2H,
  # Standard Basic", "Monster - Item, Bag - Brown" -- verified live: 562
  # rows start with this exact "Monster - " prefix, all internal
  # NPC-display-only models; real items that merely contain the word
  # "Monster" elsewhere (e.g. "Monster Omelet", "Monster Slayer's Kit",
  # "Deep Sea Monsterbelly") do not start with it and are unaffected
  # (M4.9.3.1 final review fix).
  - '(?i)^Monster - '
  # Legacy/superseded spell variant tagged with a literal "(OLD)" suffix,
  # e.g. "Resistance (OLD)" (id 2381), "Rejuvenation (OLD)" (id 2598),
  # "Demon Slayer (OLD)" (id 4651/4659) -- verified live against the full
  # real Spell.dbc: exactly 7 rows match, every one an internal legacy
  # duplicate of a real, still-live spell of the same base name (M4.9.6,
  # filler_reward_effects buff-candidate extraction).
  - '(?i)\(OLD\)'
  # Internal QA/debug spell naming with a digit glued directly onto "Test"
  # with no space, e.g. "MHTest01"/"MHTest02"/"MHTest03",
  # "GGOODMANTEST2"/"GGOODMANTEST3", "Ignore All Gear Test2" -- the
  # existing \btest\b pattern above requires "test" as an isolated word
  # and misses these (no boundary between the glued prefix and "Test").
  # Verified live against the full real Spell.dbc: exactly 8 rows match,
  # all internal (M4.9.6, filler_reward_effects buff-candidate
  # extraction).
  - '(?i)Test\d+'
  # Internal QA/debug artifact spell literally named after the bug it was
  # created to reproduce, e.g. "Spell Steal Bug" (id 67007, the exact spell
  # this catches in the current filler-buff candidate set), "Charge Bug",
  # "Explode Bug", "Mutate Bug", "Summon Dupe Bug", "Dig Up Disgruntled/
  # Glinting Bug", "Bug 164364 Effect/Immunity", "Bug 180273"/"Bug 180273
  # Effect", "Bug 181860 Effect"/"Effect Linked Aura"/"Proc" -- verified
  # live against the FULL real Spell.dbc (all 49,839 name rows, not just
  # the filler-buff candidate subset): exactly 16 rows match a bare
  # \bBug\b, every one an internal QA/debug artifact, none player-facing
  # (final whole-branch review finding I2, M4.9.6).
  - '(?i)\bBug\b'
  # Internal QA/dev slang "Uber" (developer shorthand for "way too
  # strong/overpowered", never real Blizzard player-facing flavor text),
  # e.g. "Uber Spirit 80 Buff" (id 54303, the exact spell this catches in
  # the current filler-buff candidate set), "QA Uber Spell Debuff", "Shirt
  # of Uber Aura/Hit Aura/Rating Aura", "Uber Spell Controller", "Uber
  # Stealth", "Uber Heal Over Time"/"Debuff Uber Heal Over Time", "Shoot
  # Uber Fireball"/"Uber Fireball Reflect" -- verified live against the
  # FULL real Spell.dbc: exactly 15 rows match a bare \bUber\b, every one
  # internal/QA, none player-facing (final whole-branch review finding
  # I2, M4.9.6).
  - '(?i)\bUber\b'
  # Internal QA-style "<number> Buff" naming shape -- a bare numeric
  # level/tier tag glued directly onto the literal word "Buff" with no
  # other real-content framing (unlike a genuine Blizzard buff name, which
  # never ends in a raw digit + "Buff"), e.g. "30% Crit 80 Buff" (id
  # 54675) and "Uber Spirit 80 Buff" (id 54303, already caught by the
  # \bUber\b pattern above too -- this pattern independently catches
  # 54675, which no other pattern here matches). Verified live against
  # the FULL real Spell.dbc: exactly 2 rows match, both internal QA
  # testing-tier buffs (final whole-branch review finding I2, M4.9.6).
  - '(?i)\d+\s+Buff\b'
  # A single, severe balance-breaking permanent +100% critical strike
  # chance buff -- spell 54283 "Increase Critical Strike Chance 100%".
  # Verified live: this is the ONLY spell in the entire real Spell.dbc
  # whose name contains "Increase Critical Strike Chance" at all (no
  # lower/legitimate-tier sibling exists), consistent with an
  # internal/debug balance-testing artifact rather than real player
  # content -- randomly granting a permanent +100% crit buff as filler
  # would be a severe, unintended power-level break (final whole-branch
  # review finding I2, M4.9.6).
  - '(?i)Increase Critical Strike Chance 100%'
  # Internal profession-specialization pseudo-factions used only by
  # Faction.dbc's internal recipe-tracking bookkeeping, e.g. " Blacksmithing
  # - Armorsmithing" (note the leading space -- a real, confirmed DBC
  # quirk), " Leatherworking - Elemental", " Engineering - Goblin" --
  # verified live against the full real 105-row reputation-pane roster
  # (Faction.dbc reputationListID >= 0): exactly 10 rows match, all
  # internal profession-specialization tracking, none player-facing, none a
  # real earnable reputation bar. Also verified against every other
  # is_denylisted consumer's real name source (item_template.name,
  # creature_template.name, quest_template.LogTitle,
  # gameobject_template.name, Spell.dbc SpellName): zero collisions
  # (Repsanity family, M4.10.4 final whole-branch review fix I1).
  - '(?i)^\s*(?:Blacksmithing|Leatherworking|Engineering) - \w+$'
  # Reputation-pane UI headers and non-earnable "Forces" parent factions --
  # "Horde"/"Alliance" (faction-group headers), "The Burning Crusade"/
  # "Classic" (expansion-tab headers), "Alliance Forces"/"Horde Forces"
  # (warfront parent factions with no real reputation bar of their own).
  # "Wrath of the Lich King" and "Sholazar Basin" are the same kind of junk
  # for Repsanity but are deliberately NOT added here -- each collides with
  # real, already-shipped content in other families that share this
  # denylist (a real quest_template.LogTitle row and/or a real Spell.dbc
  # name); see extract_repsanity.py's own _LOCAL_DENYLIST for those two
  # plus "REUSE" and the full verification notes. Verified live against the
  # full real 105-row reputation-pane roster: exactly 6 rows match this
  # pattern; verified zero collisions against every other is_denylisted
  # consumer's real name source (Repsanity family, M4.10.4 final
  # whole-branch review fix I1).
  - '(?i)^(?:Horde|Alliance|Alliance Forces|Horde Forces|The Burning Crusade|Classic)$'
  # Internal reputation-conversion bookkeeping rows (a player's standing
  # with one faction being converted/carried over to a successor faction,
  # e.g. Tranquillien -> The Sunreavers when a Blood Elf/Alliance character
  # crosses over), never a real earnable reputation bar of their own --
  # verified live: exactly these 4 rows exist in the full real 105-row
  # reputation-pane roster; verified zero collisions against every other
  # is_denylisted consumer's real name source (Repsanity family, M4.10.4
  # final whole-branch review fix I1).
  - '(?i)^(?:Tranquillien Conversion|Wintersaber Conversion|Silver Covenant Conversion|Sunreavers Conversion)$'
  # Misc internal/unobtainable reputation-pane row -- "Friendly, Hidden" (an
  # internal display-state row, not a real faction). "REUSE" is the same
  # kind of junk for Repsanity but is deliberately NOT added here -- it
  # collides with real, already-shipped quest_template.LogTitle rows and
  # real Spell.dbc rows in other families that share this denylist; see
  # extract_repsanity.py's own _LOCAL_DENYLIST. Verified live: exactly 1 row
  # matches this pattern (Repsanity family, M4.10.4 final whole-branch
  # review fix I1).
  - '(?i)^Friendly, Hidden$'
